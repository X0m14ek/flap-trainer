<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#080505" />
    <meta name="color-scheme" content="dark" />
    <title>Тренажёр флапа</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <main id="app" aria-label="Тренажёр флапа">
      <section data-screen="menu" class="screen menu" aria-label="Выбор хитбокса">
        <p class="eyebrow">Тренажёр</p>
        <div class="carousel">
          <button type="button" class="arrow" data-action="prev" aria-label="Предыдущий">‹</button>
          <div class="character">
            <p id="character-name" class="character-name"></p>
            <p id="character-hitbox" class="character-hitbox"></p>
          </div>
          <button type="button" class="arrow" data-action="next" aria-label="Следующий">›</button>
        </div>
        <p class="best">Рекорд <span id="best-score">0</span></p>
        <div class="rules" role="group" aria-label="Коллизии">
          <button id="rules-23" type="button" data-action="rules-23" aria-pressed="true">v23 · круги</button>
          <button id="rules-24" type="button" data-action="rules-24" aria-pressed="false">v24 · контур</button>
        </div>
        <label class="toggle"><input id="sprite-toggle" type="checkbox"> Рамка спрайта 150 px</label>
        <button type="button" class="play" data-action="play">Играть</button>
      </section>
      <section data-screen="game" class="screen game" aria-label="Игра" hidden>
        <canvas id="game-canvas" tabindex="0"></canvas>
        <p id="game-score" class="game-score" aria-live="off">0</p>
        <div id="resume-overlay" class="countdown" hidden>
          <p id="resume-countdown" aria-live="polite"></p>
        </div>
        <div id="result" class="result" hidden>
          <p id="result-score" class="result-score">0</p>
          <p id="result-detail" class="result-detail"></p>
          <div class="result-actions">
            <button type="button" class="play" data-action="again">Ещё раз</button>
            <button type="button" class="secondary" data-action="menu">Меню</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
